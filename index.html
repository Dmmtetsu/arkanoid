<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arkanoid</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Arkanoid</h1>
      <p class="instructions">Move with &larr;/&rarr; arrows or A/D. Press Space to launch/restart.</p>
      <canvas id="game" width="800" height="600" aria-label="Arkanoid game"></canvas>
      <div class="hud">
        <span id="score">Score: 0</span>
        <span id="lives">Lives: 3</span>
        <span id="level">Level: 1</span>
      </div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
